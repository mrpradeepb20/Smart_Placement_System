<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | Smart Placement</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-left">

            <h1>SmartPlacement</h1>

            <div class="welcome-text">
                <h2>Build Your Future With Us!</h2>

                <p>
                    Discover opportunities, improve your skills
                    and get ready for your dream career.
                </p>
            </div>

            <div class="bottom-text">
                Smart Student Placement Management System
            </div>

        </div>


        <div class="login-right">

            <div class="login-box">

                <h2>Welcome Back!</h2>

                <p class="subtitle">
                    Login to access your student dashboard
                </p>

                <form>

                    <label>Email Address</label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label>Password</label>

                    <input
                        type="password"
                        placeholder="Enter your password"
                        required
                    >

                    <div class="forgot">
                        <a href="#">Forgot Password?</a>
                    </div>

                    <button type="submit">
                        Login
                    </button>

                </form>

                <p class="register">
                    Don't have an account?
                    <a href="register.html">Register Now</a>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
